name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # La CI construit l'overlay sans le lancer : inutile de télécharger le binaire Electron.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
        if: runner.os == 'Windows'
      # Ubuntu : aussi les tests « slow » (rejeu des 9 parties des fixtures bg-solo-*, ~30 s).
      - run: pnpm test:slow
        if: runner.os != 'Windows'
